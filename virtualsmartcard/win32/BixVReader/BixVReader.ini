; BixVReader configuration (UMDF 2.0 virtual smart card reader)
;
; ---------- One-Card-Multi-Interface (一卡多接口) 说明 ----------
; vsmartcard 新版支持"多个 reader 汇聚到同一个后端 vpicc"，模拟真实
; 硬件上一卡多接口（7816 / 14443 / 其他）并发 + 卡内部仲裁器。
;
; 开启方法（两步）：
;
;   1) 在本 .ini 里让多个 [ReaderN] 段都是 RPC_TYPE=2 (VpcdReader)，
;      并且显式指定同一个 TCP_PORT — 它们就都会连到同一个 vpicc 后端。
;      例：
;          [Reader0]
;          RPC_TYPE=2
;          TCP_PORT=35963      ← 三个 Reader 都写这个
;          DECIVE_UNIT=0
;
;          [Reader1]
;          RPC_TYPE=2
;          TCP_PORT=35963      ← 同一个端口
;          DECIVE_UNIT=1
;
;          [Reader2]
;          RPC_TYPE=2
;          TCP_PORT=35963      ← 还是同一个端口
;          DECIVE_UNIT=2
;
;   2) 启动后端 vpicc 时用：
;          python vicc.in --type=iso7816 --reversed --multi-interface --port=35963
;
; 不需要任何 C++ 代码改动 — VpcdReader::init() 的 fallback 机制已经支持。
; 如果 TCP_PORT 没显式指定，则按默认 portBase + instance 分配（回到
; 旧的"每个 reader 独立后端"模型）。
;
; 可选：如果 vpicc 跑在远程机器，可在 [Driver] 段或每个 [ReaderN] 段
; 加 BACKEND_HOST=hostname 来覆盖默认的 localhost (NULL)。

[Driver]
; 多 reader 数量。可以设 > 1 来模拟多接口。
NumReaders=3
; 默认端口基址：如果 ReaderN 没显式写 TCP_PORT，则用 PORT_BASE + N
RPC_PORT_BASE=35963
;BACKEND_HOST=localhost

; ========== Reader 0: 管道模式 (RPC_TYPE=0) ==========
[Reader0]
RPC_TYPE=0
VENDOR_NAME=Fabio Ottavi
VENDOR_IFD_TYPE=Pipe Reader
DECIVE_UNIT=0

; ========== Reader 1: TCP/IP 模式 (RPC_TYPE=1) ==========
[Reader1]
RPC_TYPE=1
VENDOR_NAME=Fabio Ottavi
VENDOR_IFD_TYPE=TCP/IP Reader
DECIVE_UNIT=1

; ========== Reader 2: Virtual PCD 模式 (RPC_TYPE=2, 指向 vpicc) ==========
; 当前配置：Reader2 独占 vpicc 后端（TCP_PORT 显式写死）
; 想改成一卡多接口？把 NumReaders 改成 3，Reader0/1 也改成 RPC_TYPE=2
; 并且都写 TCP_PORT=35963 — 见文件顶部示例。
[Reader2]
RPC_TYPE=2
VENDOR_NAME=Virtual Smart Card Architecture
VENDOR_IFD_TYPE=Virtual PCD
TCP_PORT=35963
DECIVE_UNIT=2
